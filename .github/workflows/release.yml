name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      safe_validation:
        description: 'Run safe workflow validation (does not publish release)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JavaScript Verification
        run: |
          npm test
          npm run check

      - name: Run Kotlin Unit Tests
        run: ./gradlew test --stacktrace

      - name: Verify Production Signing Credentials
        id: signing-check
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_production_credentials=true" >> "$GITHUB_OUTPUT"
            echo "Production signing credentials detected."
          else
            echo "has_production_credentials=false" >> "$GITHUB_OUTPUT"
            if [ "$IS_TAG" = "true" ]; then
              echo "::error::Tag push detected but required production signing secrets (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD) are not configured."
              echo "A public production release must be signed with the repository owner's production release keystore. Aborting release."
              exit 1
            else
              echo "::warning::Production signing credentials are not configured. Executing workflow in safe validation mode (no release will be published)."
            fi
          fi

      - name: Prepare Keystore File
        if: steps.signing-check.outputs.has_production_credentials == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="/tmp/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "Validating keystore integrity and alias..."
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Decoded keystore could not be validated with the provided password and alias."
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi
          echo "Production keystore and alias verified successfully."

      - name: Build Release APK
        env:
          HAS_PROD: ${{ steps.signing-check.outputs.has_production_credentials }}
          RELEASE_STORE_FILE: /tmp/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "$HAS_PROD" = "true" ]; then
            echo "Building production-signed release APK..."
            ./gradlew assembleRelease --stacktrace
          else
            echo "Building release APK in test validation mode (local test-release signing)..."
            unset RELEASE_STORE_FILE RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Verify APK Signature with apksigner
        env:
          HAS_PROD: ${{ steps.signing-check.outputs.has_production_credentials }}
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          VERIFY_OUTPUT=$($APKSIGNER verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)
          echo "$VERIFY_OUTPUT"

          if [ "$HAS_PROD" = "true" ]; then
            if echo "$VERIFY_OUTPUT" | grep -q "CN=Android Debug"; then
              echo "::error::Production release APK must NOT be signed with the Android debug certificate."
              exit 1
            fi
            if echo "$VERIFY_OUTPUT" | grep -q "CN=Mario Kart Local Test Release"; then
              echo "::error::Production release APK must NOT be signed with local test certificate."
              exit 1
            fi
          fi

          if ! echo "$VERIFY_OUTPUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"; then
            echo "::error::APK v2 signature scheme verification failed."
            exit 1
          fi

          if [ "$HAS_PROD" = "false" ]; then
            echo "::warning::Signature verified using local test-release key. NOT production signed."
          fi

      - name: Stage Release Artifacts & Calculate Checksums
        run: |
          mkdir -p release-artifacts
          REF_NAME="${{ github.ref_name }}"
          if [ -z "$REF_NAME" ] || [ "$REF_NAME" = "main" ]; then
            REF_NAME="validation"
          fi
          APK_TAG="release-artifacts/MarioKart-${REF_NAME}.apk"
          APK_LATEST="release-artifacts/MarioKart.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_TAG"
          cp app/build/outputs/apk/release/app-release.apk "$APK_LATEST"

          cd release-artifacts
          sha256sum "$(basename "$APK_TAG")" "$(basename "$APK_LATEST")" > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Clean up Keystore File
        if: always()
        run: |
          if [ -f /tmp/release.keystore ]; then
            rm -f /tmp/release.keystore
            echo "Temporary keystore cleaned up."
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing-check.outputs.has_production_credentials == 'true'
        with:
          name: Mario Kart Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/MarioKart-${{ github.ref_name }}.apk
            release-artifacts/MarioKart.apk
            release-artifacts/checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
