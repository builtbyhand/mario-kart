name: Auto Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/MarioKart-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/MarioKart.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mario Kart Android ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/MarioKart-${{ github.ref_name }}.apk
            release-artifacts/MarioKart.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
